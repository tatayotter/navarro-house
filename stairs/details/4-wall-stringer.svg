<text x="24.0" y="640.0" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">Mark the 13 risers on the wall first (19.2 cm each from the finished floor). Drill 9/16″ holes in the web, hold the</text>
<text x="24.0" y="657.5" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">stringer in place, then drill the wall through the holes. Each hole must hit solid concrete; move a point a few cm if you</text>
<text x="24.0" y="675.0" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">hit a void.</text>
