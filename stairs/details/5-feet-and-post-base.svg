<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#d9d3ca"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9b9388" stroke-width="1"/></pattern></defs>
<rect width="860" height="580" fill="#ffffff"/>
<text x="24" y="34" font-size="19" font-weight="700" fill="#2b2622">5 · Stringer feet and post base (clips cut from ¼″×2″ angle, 10 cm long)</text>
<text x="24.0" y="70.0" font-size="13" fill="#2b2622" font-weight="700" text-anchor="start">A. STRINGER FOOT (side view)</text>
<rect x="34.0" y="380.0" width="372.0" height="60.0" fill="url(#hatch)" stroke="#9b9388" stroke-width="1"/>
<polygon points="70.0,380.0 245.2,215.9 332.9,215.9 157.8,380.0" fill="#3d4349" stroke="#2b2622" stroke-width="1" stroke-linejoin="round"/>
<polygon points="97.8,380.0 157.8,380.0 157.8,376.4 97.8,376.4" fill="#a8701c" stroke="#2b2622" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="154.2,380.0 157.8,380.0 157.8,350.0 154.2,350.0" fill="#a8701c" stroke="#2b2622" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="124.2,431.0 131.4,431.0 131.4,370.4 124.2,370.4" fill="#d0532a" stroke-linejoin="round"/>
<polygon points="120.0,376.4 135.6,376.4 135.6,371.6 120.0,371.6" fill="#d0532a" stroke-linejoin="round"/>
<line x1="127.8" y1="374.0" x2="250.0" y2="326.0" stroke="#6f655c" stroke-width="1" stroke-linecap="round"/>
<circle cx="127.8" cy="374.0" r="2.2" fill="#6f655c"/>
<text x="254.0" y="330.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="start">Angle clip 10 cm welded to</text>
<text x="254.0" y="345.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="start">the stringer, 1 × ½″×4″</text>
<text x="254.0" y="360.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="start">anchor into the floor</text>
<line x1="106.0" y1="362.0" x2="106.0" y2="176.0" stroke="#6f655c" stroke-width="1" stroke-linecap="round"/>
<circle cx="106.0" cy="362.0" r="2.2" fill="#6f655c"/>
<text x="106.0" y="180.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="middle">Bottom cut level (~43°),</text>
<text x="106.0" y="195.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="middle">~15 cm sits flat on the floor</text>
<text x="24.0" y="462.0" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">Right foot: one clip each side of the web (2 anchors). Left</text>
<text x="24.0" y="479.5" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">foot: the wall side has no room, so one clip inside the C to</text>
<text x="24.0" y="497.0" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">the floor plus one clip bolted to the column face.</text>
<text x="470.0" y="70.0" font-size="13" fill="#2b2622" font-weight="700" text-anchor="start">B. SUPPORT POST BASE (front view)</text>
<rect x="480.0" y="380.0" width="270.0" height="60.0" fill="url(#hatch)" stroke="#9b9388" stroke-width="1"/>
<polygon points="600.0,380.0 630.0,380.0 630.0,128.0 600.0,128.0" fill="#3d4349" stroke="#2b2622" stroke-width="1" stroke-linejoin="round"/>
<text x="615.0" y="92.0" font-size="12" fill="#2b2622" font-weight="600" text-anchor="middle">2×2 tubular post</text>
<text x="615.0" y="113.0" font-size="11" fill="#6f655c" font-weight="400" text-anchor="middle">(~2.1 m, cut on site)</text>
<polygon points="600.0,380.0 570.0,380.0 570.0,376.4 600.0,376.4" fill="#a8701c" stroke="#2b2622" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="600.0,380.0 596.4,380.0 596.4,320.0 600.0,320.0" fill="#a8701c" stroke="#2b2622" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="578.4,431.0 585.6,431.0 585.6,370.4 578.4,370.4" fill="#d0532a" stroke-linejoin="round"/>
<polygon points="574.2,376.4 589.8,376.4 589.8,371.6 574.2,371.6" fill="#d0532a" stroke-linejoin="round"/>
<polygon points="630.0,380.0 660.0,380.0 660.0,376.4 630.0,376.4" fill="#a8701c" stroke="#2b2622" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="630.0,380.0 633.6,380.0 633.6,320.0 630.0,320.0" fill="#a8701c" stroke="#2b2622" stroke-width="0.8" stroke-linejoin="round"/>
<polygon points="644.4,431.0 651.6,431.0 651.6,370.4 644.4,370.4" fill="#d0532a" stroke-linejoin="round"/>
<polygon points="640.2,376.4 655.8,376.4 655.8,371.6 640.2,371.6" fill="#d0532a" stroke-linejoin="round"/>
<line x1="546.0" y1="380.0" x2="546.0" y2="320.0" stroke="#5b6570" stroke-width="1" stroke-linecap="round"/>
<line x1="542.0" y1="384.0" x2="550.0" y2="376.0" stroke="#5b6570" stroke-width="1.4"/>
<line x1="542.0" y1="324.0" x2="550.0" y2="316.0" stroke="#5b6570" stroke-width="1.4"/>
<text x="539.0" y="354.0" font-size="12" fill="#5b6570" font-weight="600" text-anchor="end">10</text>
<line x1="648.0" y1="376.4" x2="672.0" y2="284.0" stroke="#6f655c" stroke-width="1" stroke-linecap="round"/>
<circle cx="648.0" cy="376.4" r="2.2" fill="#6f655c"/>
<text x="676.0" y="288.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="start">2 clips, 1 × ½″</text>
<text x="676.0" y="303.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="start">anchor each</text>
<line x1="630.0" y1="188.0" x2="654.0" y2="164.0" stroke="#6f655c" stroke-width="1" stroke-linecap="round"/>
<circle cx="630.0" cy="188.0" r="2.2" fill="#6f655c"/>
<text x="658.0" y="168.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="start">Top welded under</text>
<text x="658.0" y="183.0" font-size="12.5" fill="#2b2622" font-weight="400" text-anchor="start">the right stringer</text>
<text x="470.0" y="462.0" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">Clips welded all round to the post. Optional 2nd post</text>
<text x="470.0" y="479.5" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">mid-span if the right stringer bounces.</text>
<text x="24.0" y="548.0" font-size="12.5" fill="#6f655c" font-weight="400" text-anchor="start">All anchors: hammer drill, blow the hole clean, then set and tighten. About 9 cm into the concrete.</text>
</svg>
